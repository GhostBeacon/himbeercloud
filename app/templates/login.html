<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>Login - HimbeerePi</title>
<script>
(function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();
</script>
<style>
* {
box-sizing: border-box;
transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

:root {
--bg: #f8fafc;
--text: #1e293b;
--text-muted: #64748b;
--text-faint: #94a3b8;
--card-bg: #ffffff;
--border: #e2e8f0;
--border-strong: #cbd5e1;
--hover-bg: #f1f5f9;
--heading: #0f172a;
--btn-primary-bg: #334155;
--btn-primary-hover: #0f172a;
--shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
}

[data-theme="dark"] {
--bg: #0f172a;
--text: #e2e8f0;
--text-muted: #94a3b8;
--text-faint: #64748b;
--card-bg: #1e293b;
--border: #334155;
--border-strong: #475569;
--hover-bg: #1e293b;
--heading: #f8fafc;
--btn-primary-bg: #475569;
--btn-primary-hover: #64748b;
--shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background: var(--bg);
color: var(--text);
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
padding: 20px;
}

.theme-toggle {
position: fixed;
top: 20px;
right: 20px;
background: var(--card-bg);
border: 1px solid var(--border-strong);
border-radius: 8px;
width: 38px;
height: 38px;
font-size: 1.1em;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
color: var(--text);
}
.theme-toggle:hover {
background: var(--hover-bg);
}

.login-card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 14px;
box-shadow: var(--shadow);
padding: 36px 32px;
width: 100%;
max-width: 360px;
}

.login-card h1 {
font-size: 1.4em;
font-weight: 700;
color: var(--heading);
margin: 0 0 6px 0;
text-align: center;
}
.login-card .subtitle {
text-align: center;
color: var(--text-muted);
font-size: 0.88em;
margin-bottom: 28px;
}

label {
display: block;
font-size: 0.82em;
font-weight: 600;
color: var(--text-muted);
margin-bottom: 6px;
}

input[type="text"], input[type="password"] {
width: 100%;
padding: 10px 12px;
border-radius: 8px;
border: 1px solid var(--border-strong);
background: var(--bg);
color: var(--heading);
font-size: 0.95em;
margin-bottom: 18px;
outline: none;
}
input[type="text"]:focus, input[type="password"]:focus {
border-color: var(--btn-primary-bg);
box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.15);
}

button[type="submit"] {
width: 100%;
padding: 11px;
border-radius: 8px;
border: none;
background: var(--btn-primary-bg);
color: #ffffff;
font-size: 0.95em;
font-weight: 600;
cursor: pointer;
}
button[type="submit"]:hover {
background: var(--btn-primary-hover);
}

.flash-messages {
margin-bottom: 18px;
}
.flash-message {
background: rgba(239, 68, 68, 0.08);
border: 1px solid #ef4444;
color: #ef4444;
border-radius: 8px;
padding: 10px 12px;
font-size: 0.85em;
margin-bottom: 8px;
}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="Hell-/Dunkelmodus umschalten" id="themeToggleBtn">&#x1F319;</button>

<div class="login-card">
<h1>HimbeerePi</h1>
<div class="subtitle">Bitte einloggen</div>

{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="flash-messages">
{% for message in messages %}
<div class="flash-message">{{ message }}</div>
{% endfor %}
</div>
{% endif %}
{% endwith %}

<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Benutzername</label>
<input type="text" id="username" name="username" required autofocus autocomplete="username">
<label for="password">Passwort</label>
<input type="password" id="password" name="password" required autocomplete="current-password">
<button type="submit">Einloggen</button>
</form>
</div>

<script>
function updateThemeIcon() {
const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
document.getElementById('themeToggleBtn').textContent = isDark ? '\u2600\uFE0F' : '\u{1F319}';
}

function toggleTheme() {
const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
if (isDark) {
document.documentElement.removeAttribute('data-theme');
localStorage.setItem('theme', 'light');
} else {
document.documentElement.setAttribute('data-theme', 'dark');
localStorage.setItem('theme', 'dark');
}
updateThemeIcon();
}

updateThemeIcon();
</script>

</body>
</html>
